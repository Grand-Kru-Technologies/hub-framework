name: Staging OpenTofu

on:
  pull_request:
    paths:
      - "infra/opentofu/**"
      - "infra/.gitignore"
      - ".github/workflows/staging-opentofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/opentofu/**"
      - "infra/.gitignore"
      - ".github/workflows/staging-opentofu.yml"
  workflow_dispatch:
    inputs:
      workflow_action:
        description: "plan saves staging-tofu-plan on main; apply uses plan_run_id"
        required: true
        type: choice
        options:
          - plan
          - apply
      plan_run_id:
        description: "Required when workflow_action is apply: Actions run id with staging-tofu-plan artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-opentofu
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.10.2
  AWS_REGION: us-east-1
  WORKFLOW_FILE: .github/workflows/staging-opentofu.yml

jobs:
  validate:
    name: tofu validate (offline, all stacks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: validate bootstrap
        working-directory: infra/opentofu/bootstrap
        env:
          TF_VAR_local_state_encryption_passphrase: ci-offline-validate-only-passphrase
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: validate github-setup
        working-directory: infra/opentofu/github-setup
        env:
          TF_VAR_github_token: placeholder
          TF_VAR_tofu_plan_role_arn: arn:aws:iam::123456789012:role/plan
          TF_VAR_tofu_apply_role_arn: arn:aws:iam::123456789012:role/apply
          TF_VAR_state_encryption_passphrase: ci-offline-validate-only-passphrase
          TF_VAR_local_state_encryption_passphrase: ci-offline-validate-only-passphrase
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: validate staging
        working-directory: infra/opentofu/staging
        env:
          TF_VAR_railway_token: placeholder
          TF_VAR_sentry_dsn: https://example@sentry.io/0
          TF_VAR_state_encryption_passphrase: ci-offline-validate-only-passphrase
        run: |
          tofu init -backend=false -input=false
          tofu validate

  plan:
    name: tofu plan staging
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.workflow_action == 'plan')
      )
    runs-on: ubuntu-latest
    environment: staging-opentofu-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/opentofu/staging
    env:
      TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
      TF_VAR_sentry_dsn: ${{ secrets.STAGING_SENTRY_DSN }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Skip when setup not complete
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN == ''
        run: |
          echo "::notice title=OpenTofu plan skipped::TOFU_STATE_AWS_PLAN_ROLE_ARN is not set. Run scripts/setup-staging-opentofu.sh (bootstrap + github-setup) before credentialed plan on main."
      - uses: actions/checkout@v4
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
      - uses: opentofu/setup-opentofu@v1
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Configure AWS (OIDC plan role)
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_STATE_AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: tofu init -input=false
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
      - run: tofu plan -input=false -no-color -out=tfplan
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
      - run: tofu validate
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
      - uses: actions/upload-artifact@v4
        if: vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
        with:
          name: staging-tofu-plan
          path: infra/opentofu/staging/tfplan
          retention-days: 14

  apply:
    name: tofu apply staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.workflow_action == 'apply'
    runs-on: ubuntu-latest
    environment: staging-opentofu
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: infra/opentofu/staging
    env:
      TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
      TF_VAR_sentry_dsn: ${{ secrets.STAGING_SENTRY_DSN }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify plan workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ github.event.inputs.plan_run_id }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_WORKFLOW: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${PLAN_RUN_ID:-}" ]; then
            echo "::error::plan_run_id is required when workflow_action is apply"
            exit 1
          fi
          if ! [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::plan_run_id must be a numeric Actions run id, got: ${PLAN_RUN_ID}"
            exit 1
          fi
          RUN_JSON="$(gh api "repos/${EXPECTED_REPO}/actions/runs/${PLAN_RUN_ID}")"
          RUN_REPO="$(echo "$RUN_JSON" | jq -r .repository.full_name)"
          RUN_PATH="$(echo "$RUN_JSON" | jq -r .path)"
          RUN_EVENT="$(echo "$RUN_JSON" | jq -r .event)"
          RUN_BRANCH="$(echo "$RUN_JSON" | jq -r .head_branch)"
          RUN_CONCLUSION="$(echo "$RUN_JSON" | jq -r .conclusion)"
          PLAN_SHA="$(echo "$RUN_JSON" | jq -r .head_sha)"
          if [ "$RUN_REPO" != "$EXPECTED_REPO" ]; then
            echo "::error::Plan run repository mismatch: ${RUN_REPO}"
            exit 1
          fi
          if [ "$RUN_PATH" != "$EXPECTED_WORKFLOW" ]; then
            echo "::error::Plan run workflow path mismatch: ${RUN_PATH}"
            exit 1
          fi
          if [ "$RUN_EVENT" != "push" ] && [ "$RUN_EVENT" != "workflow_dispatch" ]; then
            echo "::error::Plan run event must be push or workflow_dispatch, got ${RUN_EVENT}"
            exit 1
          fi
          if [ "$RUN_BRANCH" != "main" ]; then
            echo "::error::Plan run head_branch must be main, got ${RUN_BRANCH}"
            exit 1
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::Plan run conclusion must be success, got ${RUN_CONCLUSION}"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$PLAN_SHA" origin/main; then
            echo "::error::Plan run commit ${PLAN_SHA} is not reachable from origin/main"
            exit 1
          fi
          echo "Verified plan run ${PLAN_RUN_ID} at ${PLAN_SHA}"
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Configure AWS (OIDC apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_STATE_AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-tofu-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.plan_run_id }}
          path: infra/opentofu/staging
      - run: tofu init -input=false
      - run: tofu apply -input=false -no-color tfplan
