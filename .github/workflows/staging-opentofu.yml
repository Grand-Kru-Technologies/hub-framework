name: Staging OpenTofu

on:
  pull_request:
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/staging-opentofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/staging-opentofu.yml"
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type apply to apply a saved plan on main (requires staging-opentofu environment approval)"
        required: true
        type: string
      plan_run_id:
        description: "Actions run ID from the plan job that uploaded staging-tofu-plan"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-opentofu
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.10.2
  AWS_REGION: us-east-1

jobs:
  validate:
    name: tofu validate staging (offline)
    if: >-
      github.event_name == 'pull_request' &&
      vars.TOFU_STATE_AWS_PLAN_ROLE_ARN == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/opentofu/staging
    env:
      TF_VAR_railway_token: placeholder
      TF_VAR_sentry_dsn: https://example@sentry.io/0
      TF_VAR_state_encryption_passphrase: ci-offline-validate-only
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - run: tofu init -backend=false -input=false
      - run: tofu validate

  plan:
    name: tofu plan staging
    if: >-
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      vars.TOFU_STATE_AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: staging-opentofu-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/opentofu/staging
    env:
      TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
      TF_VAR_sentry_dsn: ${{ secrets.STAGING_SENTRY_DSN }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Configure AWS (OIDC plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_STATE_AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: tofu init -input=false
      - run: tofu plan -input=false -no-color -out=tfplan
      - run: tofu validate
      - uses: actions/upload-artifact@v4
        with:
          name: staging-tofu-plan
          path: infra/opentofu/staging/tfplan
          retention-days: 14

  apply:
    name: tofu apply staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_apply == 'apply'
    runs-on: ubuntu-latest
    environment: staging-opentofu
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: infra/opentofu/staging
    env:
      TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
      TF_VAR_sentry_dsn: ${{ secrets.STAGING_SENTRY_DSN }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify plan run commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ github.event.inputs.plan_run_id }}
        run: |
          set -euo pipefail
          PLAN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" --jq .head_sha)"
          if [ -z "$PLAN_SHA" ] || [ "$PLAN_SHA" = "null" ]; then
            echo "::error::Could not resolve head_sha for plan run ${PLAN_RUN_ID}"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$PLAN_SHA" origin/main; then
            echo "::error::Plan run commit ${PLAN_SHA} is not reachable from origin/main"
            exit 1
          fi
          echo "Plan run commit ${PLAN_SHA} is on main"
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Configure AWS (OIDC apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOFU_STATE_AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-tofu-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.plan_run_id }}
          path: infra/opentofu/staging
      - run: tofu init -input=false
      - run: tofu apply -input=false -no-color tfplan
