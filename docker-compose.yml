services:
  hub-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHON_HANDLER_URL=http://python-handler:5000
    depends_on:
      python-handler:
        condition: service_healthy

  python-handler:
    build:
      context: .
      dockerfile: integrations/python/Dockerfile
    ports:
      - "5000:5000"
