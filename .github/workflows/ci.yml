name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/python/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  deploy-script:
    name: deploy script (shellcheck + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck scripts/*.sh
      - run: python -m unittest discover -s scripts/tests -v

  stack:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: hub /health
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/health
      - name: python-handler /health lists exampleTaskPython
        run: curl -fsS http://localhost:5000/health | tee /dev/stderr | grep -q exampleTaskPython
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: remote forward integration (stub upstream)
        run: go test -count=1 ./service/remoteforward/... -run TestForwardIntegration
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
