apiVersion: v1
specType: Aggregate
spec:
  name: forward
  apiName: smokeApp
  isPublic: true
  schemaName: Recipe
  schemaVersion: v0.0.2
  handlers:
    - methods: ["POST"]
      inbound: []
      outbound:
        - name: CallExampleTaskPython
          type: HttpService
          precedence: 1
          executionType: sync
          mustFinish: true
          onError: LogAndFail
          enabled: True
          config:
            pathprefix: /apply/exampleTaskPython
            appendRequestPath: false
            clientTimeout: 15
      target:
        name: echoBody
        type: Noop
